# Updates the data and publishes the page (the site/ folder) to GitHub Pages: panahovf.github.io/nine-to-five/
#
# Runs:
#   - every weekday at 8:35 Toronto time (Statistics Canada publishes at 8:30), then again every hour until mid-afternoon
#     (GitHub sometimes starts a scheduled run late, or not at all): first asks Statistics Canada whether any of the
#     page's tables got new data today that the page doesn't have yet (tools/released_today.py, a second or two). Only
#     if one did: downloads the series (step 1), rebuilds the page's data (step 2) and, if any number changed, commits
#     site/data/labour.json and site/tile.json and publishes. Otherwise it stops there;
#   - every Saturday: the full update whatever the list says, as a safety net (a release the check missed, a correction);
#   - by hand: Actions tab -> "Update and publish" -> "Run workflow" (the full update, and always publishes);
#   - whenever something is pushed to main: publishes site/ as it is in the repository, without downloading.
#
# A run that fails (a download error, or a check in step 2 that stops it) changes nothing: the page keeps its last good
# data, and GitHub emails the repository's owner.

name: Update and publish

on:
  schedule:
    # GitHub's schedule is in UTC: every hour at :35 from 12:35 to 20:35 UTC, i.e. 7:35 to 15:35 in Toronto in winter and
    # 8:35 to 16:35 in summer. A run before 8:30 finds nothing released yet; once the page has the day's release, the
    # later runs stop at the check.
    - cron: "35 12-20 * * 1-5"
    - cron: "0 14 * * 6"         # Saturdays at 9:00 or 10:00: the full update, whatever the list says
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write      # to commit the new data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-24.04      # (it still offers Python 3.9, which the notebooks' pinned versions need; ubuntu-latest no longer does)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # weekday runs: did Statistics Canada release any of the page's tables today?
      - name: Has Statistics Canada released any of our tables today?
        id: released
        if: github.event_name == 'schedule' && github.event.schedule != '0 14 * * 6'
        run: python3 tools/released_today.py

      # update on Saturdays, by hand, or on a weekday with a release; a push only publishes
      - name: Update or not
        id: go
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then update=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 14 * * 6" ]; then update=true
          else update="${{ steps.released.outputs.released }}"; fi
          echo "Update: $update"
          echo "update=$update" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.go.outputs.update == 'true'
        with:
          python-version: "3.9"
          cache: pip

      - name: Install what the notebooks need
        if: steps.go.outputs.update == 'true'
        run: pip install -r requirements.txt

      - name: Download the Statistics Canada series (step 1)
        if: steps.go.outputs.update == 'true'
        working-directory: data
        run: jupyter nbconvert --to notebook --execute 01_fetch_statcan.ipynb --output-dir /tmp/runs --ExecutePreprocessor.timeout=600

      - name: Build the page's data (step 2)
        if: steps.go.outputs.update == 'true'
        working-directory: data
        run: jupyter nbconvert --to notebook --execute 02_build_labour.ipynb --output-dir /tmp/runs --ExecutePreprocessor.timeout=600

      # labour.json always gets a new "built_at" time; it counts as changed only if anything else in it changed.
      - name: Did any number change?
        id: check
        if: steps.go.outputs.update == 'true'
        run: |
          python - <<'EOF'
          import json, os, subprocess
          new = json.load(open("site/data/labour.json"))
          old = json.loads(subprocess.run(["git", "show", "HEAD:site/data/labour.json"], capture_output=True, text=True, check=True).stdout)
          new.pop("built_at", None); old.pop("built_at", None)
          changed = new != old
          print("New data:", new["updated"]["survey"], new["updated"]["month"]) if changed else print("Nothing changed.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          EOF

      - name: Commit the new data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/labour.json site/tile.json
          git commit -m "Data: $(python -c 'import json; u = json.load(open("site/data/labour.json"))["updated"]; print(u["survey"], u["month"])')"
          git pull --rebase
          git push

      # Publish after a push, a run by hand, or new data; a weekday run with nothing new stops here.
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'schedule' || steps.check.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
